name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "webhook/cloudflare-worker/**"
      - "tools/build_webhook_data.py"
      - "config.json"
      - "trips/**"
      - "generated/line_flex_messages.json"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webhook/cloudflare-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webhook/cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Worker syntax
        run: |
          node --check src/index.js
          node --check src/accounting-page.js

      - name: Build trip data
        run: npm run build:data

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: npx wrangler deploy
