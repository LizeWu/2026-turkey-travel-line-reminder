name: Send travel reminder

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Optional day number to send, e.g. 3"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send LINE reminder
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          INPUT_DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -n "${INPUT_DAY}" ]; then
            python send_line_reminder.py --day "${INPUT_DAY}"
          else
            python send_line_reminder.py
          fi
