name: Accounting maintenance

on:
  workflow_dispatch:
    inputs:
      trip_id:
        description: "Trip ID to clear, e.g. 2026-05-turkey"
        required: true
        default: "2026-05-turkey"
      confirm_text:
        description: "Type CLEAR_ACCOUNTING_DATA to confirm"
        required: true

jobs:
  clear-accounting-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webhook/cloudflare-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webhook/cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate input
        env:
          TRIP_ID: ${{ github.event.inputs.trip_id }}
          CONFIRM_TEXT: ${{ github.event.inputs.confirm_text }}
        run: |
          if [ "${CONFIRM_TEXT}" != "CLEAR_ACCOUNTING_DATA" ]; then
            echo "confirm_text must be CLEAR_ACCOUNTING_DATA"
            exit 1
          fi
          if ! [[ "${TRIP_ID}" =~ ^[a-zA-Z0-9._-]{3,80}$ ]]; then
            echo "Invalid trip_id: ${TRIP_ID}"
            exit 1
          fi

      - name: Soft delete expenses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          TRIP_ID: ${{ github.event.inputs.trip_id }}
        run: |
          npx wrangler d1 execute lize-tour-accounting --remote \
            --command "UPDATE expenses SET deleted_at = datetime('now') WHERE trip_id = '${TRIP_ID}' AND deleted_at IS NULL;"

      - name: Deactivate ledger members
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          TRIP_ID: ${{ github.event.inputs.trip_id }}
        run: |
          npx wrangler d1 execute lize-tour-accounting --remote \
            --command "UPDATE ledger_members SET status = 'inactive', last_seen_at = datetime('now') WHERE trip_id = '${TRIP_ID}' AND status = 'active';"

      - name: Verify remaining active data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          TRIP_ID: ${{ github.event.inputs.trip_id }}
        run: |
          npx wrangler d1 execute lize-tour-accounting --remote \
            --command "SELECT 'expenses' AS table_name, COUNT(*) AS active_count FROM expenses WHERE trip_id = '${TRIP_ID}' AND deleted_at IS NULL UNION ALL SELECT 'ledger_members' AS table_name, COUNT(*) AS active_count FROM ledger_members WHERE trip_id = '${TRIP_ID}' AND status = 'active';"
