name: Send morning greeting

on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Optional day number to send, e.g. 3"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare sent records directory
        run: mkdir -p .sent-reminders

      - name: Restore sent records
        uses: actions/cache/restore@v4
        with:
          path: .sent-reminders
          key: azuma-sent-reminders-${{ github.run_id }}
          restore-keys: |
            azuma-sent-reminders-

      - name: Send LINE greeting
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SENT_RECORD_PATH: .sent-reminders/reminders.json
          INPUT_DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -n "${INPUT_DAY}" ]; then
            python send_line_reminder.py --mode greeting --day "${INPUT_DAY}"
          else
            python send_line_reminder.py --mode greeting
          fi

      - name: Save sent records
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sent-reminders
          key: azuma-sent-reminders-${{ github.run_id }}
