<svg xmlns="http://www.w3.org/2000/svg" width="430" height="760" viewBox="0 0 430 760">
  <defs>
    <style>
      .bg { fill: #eef4ef; }
      .card { fill: #fff; stroke: #dfe7df; stroke-width: 1; }
      .panel { fill: #f8faf8; stroke: #dfe7df; stroke-width: 1; }
      .soft { fill: #fff; stroke: #dfe7df; stroke-width: 1; }
      .mutedPanel { fill: #fafafa; stroke: #e8ece8; stroke-width: 1; }
      .title { fill: #0f7a5f; font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .titleNote { fill: #748078; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { fill: #0f7a5f; font: 900 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .person { fill: #1f2933; font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #4f5b53; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #748078; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .amount { fill: #009688; font: 900 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .button { fill: #fff; stroke: #dfe7df; stroke-width: 1; }
      .buttonText { fill: #0f7a5f; font: 800 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pill { fill: #fff; stroke: rgba(0,0,0,.08); stroke-width: 1; }
      .caption { fill: #8a6b2f; font: 800 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="430" height="760"/>

  <g transform="translate(14 18)">
    <rect class="card" width="402" height="724" rx="8"/>

    <g transform="translate(14 18)">
      <text class="title" x="0" y="18">結算清單</text>
      <g transform="translate(0 34)">
        <circle cx="7" cy="7" r="7" fill="none" stroke="#748078" stroke-width="1.7"/>
        <line x1="7" y1="6" x2="7" y2="11" stroke="#748078" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="7" cy="3" r="1" fill="#748078"/>
        <text class="titleNote" x="18" y="11">先顯示淨額簡化後的付款建議，再保留核對依據</text>
      </g>
    </g>

    <line x1="14" y1="88" x2="388" y2="88" stroke="#dfe7df"/>

    <g transform="translate(14 112)">
      <rect class="panel" width="374" height="610" rx="8"/>

      <g transform="translate(14 14)">
        <circle cx="14" cy="14" r="14" fill="#748078"/>
        <circle cx="14" cy="11" r="4" fill="none" stroke="#fff" stroke-width="2"/>
        <path d="M7 24v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <text class="person" x="36" y="19">不在群組中的俊榜</text>
      </g>

      <g transform="translate(14 62)">
        <text class="section" x="0" y="0">建議付款方式</text>
        <text class="small" x="0" y="20">同幣別淨額簡化，不跨幣別抵銷</text>

        <g transform="translate(0 36)">
          <rect class="soft" width="346" height="58" rx="8"/>
          <text class="body" x="12" y="34">付給</text>
          <rect class="pill" x="46" y="16" width="70" height="26" rx="13"/>
          <text class="body" x="58" y="34">Lize Wu</text>
          <text class="amount" x="126" y="34">¥ 900</text>
          <rect class="button" x="264" y="14" width="68" height="30" rx="15"/>
          <text class="buttonText" x="278" y="34">待結清</text>
        </g>

        <g transform="translate(0 104)">
          <rect class="soft" width="346" height="58" rx="8"/>
          <text class="body" x="12" y="34">付給</text>
          <rect class="pill" x="46" y="16" width="70" height="26" rx="13"/>
          <text class="body" x="58" y="34">Lize Wu</text>
          <text class="amount" x="126" y="34">NT$ 1,400</text>
          <rect class="button" x="264" y="14" width="68" height="30" rx="15"/>
          <text class="buttonText" x="278" y="34">待結清</text>
        </g>

        <g transform="translate(0 172)">
          <rect class="soft" width="346" height="58" rx="8"/>
          <text class="body" x="12" y="34">付給</text>
          <rect class="pill" x="46" y="16" width="80" height="26" rx="13"/>
          <text class="body" x="58" y="34">Miley Ho</text>
          <text class="amount" x="136" y="34">NT$ 100</text>
          <rect class="button" x="264" y="14" width="68" height="30" rx="15"/>
          <text class="buttonText" x="278" y="34">待結清</text>
        </g>
      </g>

      <g transform="translate(14 328)">
        <text class="section" x="0" y="0">推導依據</text>
        <text class="small" x="0" y="20">保留目前逐筆結算邏輯，文字改短方便查帳</text>

        <g transform="translate(0 38)">
          <rect class="mutedPanel" width="346" height="64" rx="8"/>
          <text class="body" x="12" y="26">俊榜應付 Lize Wu</text>
          <text class="amount" x="224" y="26">NT$ 1,500</text>
          <text class="small" x="12" y="48">烈酒</text>
        </g>

        <g transform="translate(0 112)">
          <rect class="mutedPanel" width="346" height="64" rx="8"/>
          <text class="body" x="12" y="26">Lize Wu 應付 Miley Ho</text>
          <text class="amount" x="236" y="26">NT$ 100</text>
          <text class="small" x="12" y="48">拉麵</text>
        </g>

        <g transform="translate(0 202)">
          <rect x="0" y="0" width="346" height="56" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
          <text class="caption" x="12" y="23">淨額簡化</text>
          <text x="12" y="41" fill="#9a3412" font="700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Lize Wu 的 NT$100 應付款，</text>
          <text x="12" y="58" fill="#9a3412" font="700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">改由俊榜直接付給 Miley Ho。</text>
        </g>
      </g>
    </g>
  </g>
</svg>
